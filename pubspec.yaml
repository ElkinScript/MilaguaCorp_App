name: milaguacorp
description: "Milagua Corp — App para empleados de ventas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  either_dart: ^1.0.0
  intl: ^0.20.2
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.3.2
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  gap: ^3.0.1
  package_info_plus: ^8.0.0
  loading_overlay: ^0.5.0
  uuid: ^4.5.1
  envied: ^0.5.4
  device_preview_plus: ">=2.0.0 <2.3.3"
  logger: ^2.4.0
  image_picker: ^1.1.2
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.5.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  envied_generator: ^0.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/lottie/
